[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-rag-system"
version = "1.0.0"
description = "Voice-Enabled Agentic RAG System with hybrid retrieval and grounded generation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiohttp>=3.9.5",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
